[project]
name = "finflow-fraud"
version = "0.4.0"
description = "Real-time fraud scoring for FinFlow transfers"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
