apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud
spec:
  replicas: 2
  selector:
    matchLabels: { app: fraud }
  template:
    metadata:
      labels: { app: fraud }
    spec:
      containers:
        - name: fraud
          image: ghcr.io/finflow/fraud:latest
          ports: [{ containerPort: 8000 }]
          env:
            - { name: FRAUD_REVIEW_THRESHOLD, value: "0.4" }
            - { name: FRAUD_BLOCK_THRESHOLD, value: "0.8" }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
---
apiVersion: v1
kind: Service
metadata:
  name: fraud
spec:
  selector: { app: fraud }
  ports: [{ port: 8000 }]
